<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Language" content="pt-BR">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- TODO: Set the document title to the name of your application -->
    <title>Catálogo de Produtos</title>
    <meta name="description" id="meta-desc" content="Catálogo digital de produtos">
    <meta name="author" id="meta-author" content="Loja" />

    <meta property="og:type" content="website" />
    <meta property="og:title" id="og-title" content="Catálogo de Produtos">
    <meta name="twitter:title" id="twitter-title" content="Catálogo de Produtos">
    <meta property="og:description" id="og-desc" content="Catálogo digital de produtos">
    <meta name="twitter:description" id="twitter-desc" content="Catálogo digital de produtos">
    <meta property="og:image" id="og-image" content="/banner-gym.png">
    <meta name="twitter:image" id="twitter-image" content="/banner-gym.png">
    <link rel="icon" type="image/png" href="/favicon-192x192.png">
    <link rel="apple-touch-icon" href="/favicon-192x192.png">
    
    <script>
      try {
        const apiUrl = '%VITE_ADMIN_API%';
        if (apiUrl && !apiUrl.startsWith('%')) {
          fetch(apiUrl + '/store/settings/manifest.json')
            .then(res => res.ok ? res.json() : null)
            .then(data => {
              if (data && data.name) {
                document.title = data.name;
              }
            }).catch(() => {});
        }
      } catch (e) {}
    </script>
  <link rel="manifest" href="%VITE_ADMIN_API%/store/settings/manifest.json" crossorigin="anonymous">
</head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
